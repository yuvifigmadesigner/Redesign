<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interface Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              // Body / UI
              sans: ['"PP Mori"', 'ui-sans-serif', 'system-ui', '-apple-system', '"Segoe UI"', 'Helvetica', 'Arial', 'sans-serif'],
              // Display — kept under the `serif` key so existing font-serif usage still resolves
              serif: ['"Stardos Stencil"', 'ui-serif', 'Georgia', 'serif'],
            },
            colors: {
              // Brand — D75262
              brand: {
                DEFAULT: '#D75262',
                50: '#FCF3F4',
                100: '#F9E6E8',
                200: '#F2C8CE',
                300: '#E9A4AE',
                400: '#E07C8B',
                500: '#D75262',
                600: '#C03C4D',
                700: '#9E2F3D',
                800: '#7A252F',
              },
              // Warm paper — ECE9DF
              cream: {
                DEFAULT: '#ECE9DF',
                50: '#FAF9F6',
                100: '#F5F3EC',
                200: '#ECE9DF',
                300: '#DCD8CA',
                400: '#C6C0AC',
                500: '#ADA692',
              },
              // Secondary text — 727070
              muted: {
                DEFAULT: '#727070',
                300: '#ABA9A9',
                400: '#949292',
                500: '#727070',
                600: '#5B5959',
              },
              // Ink — 1A1A1A
              ink: {
                DEFAULT: '#1A1A1A',
                700: '#2E2E2E',
                800: '#242424',
                900: '#1A1A1A',
              },
              background: '#ECE9DF',
              surface: '#FFFFFF',
              textPrimary: '#1A1A1A',
              textSecondary: '#727070',
              accent: '#D75262',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #ECE9DF;
        color: #1A1A1A;
        font-family: 'PP Mori', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
      
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }

      /* Elegant scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #C6C0AC;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ADA692;
      }

      /* Scroll reveal: elements start paused, IntersectionObserver adds .animate */
      @keyframes animationIn {
        0% {
          opacity: 0;
          transform: translateY(30px);
          filter: blur(8px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0px);
        }
      }

      .animate-on-scroll {
        animation-play-state: paused !important;
      }
      .animate-on-scroll.animate {
        animation-play-state: running !important;
      }

      @media (prefers-reduced-motion: reduce) {
        .animate-on-scroll {
          animation: none !important;
          opacity: 1 !important;
          filter: none !important;
          transform: none !important;
        }
      }

      /* Sticker icons: white die-cut contour + soft drop shadow.
         Chained drop-shadows compound, so four axis-aligned passes
         build an even outline around any glyph or emoji. */
      .sticker-icon {
        filter:
          drop-shadow(2px 0 0 #fff)
          drop-shadow(-2px 0 0 #fff)
          drop-shadow(0 2px 0 #fff)
          drop-shadow(0 -2px 0 #fff)
          drop-shadow(0 2px 3px rgba(26, 26, 26, 0.10));
      }

      .sticker-icon-sm {
        filter:
          drop-shadow(1.5px 0 0 #fff)
          drop-shadow(-1.5px 0 0 #fff)
          drop-shadow(0 1.5px 0 #fff)
          drop-shadow(0 -1.5px 0 #fff)
          drop-shadow(0 1.5px 2px rgba(26, 26, 26, 0.12));
      }

      /* "There's more behind this" cue on the card's + button.
         Plays only after the visitor has swept the full before/after difference. */
      @keyframes ctaRing {
        0% {
          transform: scale(1);
          opacity: 0.5;
        }
        100% {
          transform: scale(2.1);
          opacity: 0;
        }
      }

      @keyframes ctaNudge {
        0%, 100% {
          transform: scale(1) rotate(0deg);
        }
        35% {
          transform: scale(1.3) rotate(90deg);
        }
        70% {
          transform: scale(1) rotate(90deg);
        }
      }

      .cta-ring {
        animation: ctaRing 1.6s cubic-bezier(0.22, 1, 0.36, 1) 3;
      }
      .cta-nudge {
        animation: ctaNudge 1.6s ease-out 3;
      }

      @media (prefers-reduced-motion: reduce) {
        .cta-ring,
        .cta-nudge {
          animation: none !important;
        }
      }

      /* --- Hero entrance (runs on load, it sits above the fold) --- */

      /* Headline lines slide up from behind a mask */
      @keyframes heroLineUp {
        from {
          transform: translateY(105%);
        }
        to {
          transform: translateY(0);
        }
      }

      @keyframes heroFadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .hero-line {
        animation: heroLineUp 0.95s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .hero-fade {
        animation: heroFadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* --- Gallery cards reveal one by one as they scroll into view --- */
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(34px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .card-reveal {
        opacity: 0;
      }
      .card-reveal.is-revealed {
        animation: cardIn 0.75s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @media (prefers-reduced-motion: reduce) {
        .hero-line,
        .hero-fade,
        .card-reveal.is-revealed {
          animation: none !important;
        }
        .card-reveal {
          opacity: 1 !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "matter-js": "https://esm.sh/matter-js@0.19.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="antialiased selection:bg-black selection:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
